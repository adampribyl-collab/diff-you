# Sestavení a nasazení webu.
# Spustí se po každé změně ve větvi main – i po uložení v redakci (/admin/).
#
# 1) GitHub Pages: web se vždy nasadí na https://adampribyl-collab.github.io/diff-you/
#    (vlastní doménu lze později nastavit v Settings → Pages → Custom domain).
# 2) FTP (volitelně, až bude vlastní hosting): v Settings → Secrets and variables → Actions vytvořte
#      FTP_SERVER    např. ftp.vashosting.cz
#      FTP_USERNAME
#      FTP_PASSWORD
#      FTP_DIR       (volitelně) složka webu na serveru, musí končit lomítkem, např. /www/
#    Bez nich se krok FTP přeskočí.

name: Sestavení a nasazení webu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# nasazení jdou za sebou, nikdy dvě najednou
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalace
        run: npm ci

      - name: Sestavení (fotky + web)
        run: npm run build

      - name: Příprava pro GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Nahrání na hosting (FTP)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR || './' }}

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nasazení na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
